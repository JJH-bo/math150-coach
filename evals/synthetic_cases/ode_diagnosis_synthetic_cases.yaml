version: 1
description: >
  Synthetic diagnosis lab cases for pressure-testing root-cause attribution
  without requiring real learner samples. These cases are not golden evals and
  must not change the frozen scoring/diagnosis/movement eval contracts.
cases:
  - id: synthetic_process_right_calc_wrong
    category: process_right_calculation_wrong
    purpose: Method and transformation are stable, but local calculation breaks the final answer.
    scoring_path: manual_override
    question:
      id: synthetic_q_process_right_calc_wrong
      node_id: ode_separable
      question_type: practice
      prompt: Solve the separable equation y' = 2xy.
      tested_dimensions: [trigger, method, transformation, process, calculation, final_answer]
      metadata:
        challenge_chapter_id: ode_network_mvp
    user_answer: "It is separable. dy/y=2x dx, integrate, but I write ln|y|=x+C so y=Ce^x."
    score_overrides:
      trigger: 90
      method: 90
      transformation: 88
      process: 84
      calculation: 20
      final_answer: 0
    expected_pass_state: fail
    expected_root_cause: calculation_error
    expected_primary_errors: [calculation_error]
    expected_derived_errors: []
    expected_recommended_action: calculation_repair
    expected_repair_target_node_id: ode_separable.calculation
    expected_confidence_band: medium

  - id: synthetic_answer_right_trigger_unclear
    category: false_pass
    purpose: Correct final answer cannot prove mastery when trigger and method evidence are weak.
    scoring_path: manual_override
    question:
      id: synthetic_q_answer_right_trigger_unclear
      node_id: ode_separable
      question_type: practice
      prompt: Solve y' = 2xy and explain why your method applies.
      tested_dimensions: [trigger, method, process, calculation, final_answer]
      metadata:
        challenge_chapter_id: ode_network_mvp
    user_answer: "The answer is y=Ce^(x^2)."
    score_overrides:
      trigger: 20
      method: 25
      process: 35
      calculation: 85
      final_answer: 95
    expected_pass_state: false_pass
    expected_root_cause: trigger_failure
    expected_primary_errors: [trigger_failure]
    expected_derived_errors: [method_error, process_gap]
    expected_recommended_action: trigger_drill
    expected_repair_target_node_id: ode_separable.trigger
    expected_confidence_band: medium

  - id: synthetic_concept_imprecise_not_plain_wrong
    category: partial_concept
    purpose: Concept answer is partly right and should be diagnosed as imprecise, not treated as total failure.
    scoring_path: manual_override
    question:
      id: synthetic_q_concept_imprecise_not_plain_wrong
      node_id: ode_basic_concept
      question_type: practice
      prompt: Explain what a differential equation is.
      tested_dimensions: [concept, expression]
    user_answer: "It is an equation with derivatives, but I do not clearly say unknown function or variables."
    score_overrides:
      concept: 58
      expression: 78
    expected_pass_state: partial_pass
    expected_root_cause: concept_gap
    expected_primary_errors: [concept_gap]
    expected_derived_errors: []
    expected_recommended_action: current_node_review
    expected_ability_state: understands_but_imprecise
    expected_confidence_band: medium

  - id: synthetic_method_error_not_calc
    category: method_vs_calculation
    purpose: Wrong method should dominate downstream low process and final answer evidence.
    scoring_path: manual_override
    question:
      id: synthetic_q_method_error_not_calc
      node_id: ode_first_order_linear
      question_type: practice
      prompt: Solve y' + y = x with a suitable first-order method.
      tested_dimensions: [trigger, method, process, calculation, final_answer]
      metadata:
        challenge_chapter_id: ode_network_mvp
    user_answer: "I see it is first-order, but I try direct separation and get stuck."
    score_overrides:
      trigger: 75
      method: 20
      process: 30
      calculation: 35
      final_answer: 0
    expected_pass_state: fail
    expected_root_cause: method_error
    expected_primary_errors: [method_error]
    expected_derived_errors: [process_gap, calculation_error]
    expected_recommended_action: method_comparison
    expected_confidence_band: medium

  - id: synthetic_transformation_downstream_final
    category: transformation_root
    purpose: Trigger and method are acceptable, but the transformation to solvable form fails.
    scoring_path: manual_override
    question:
      id: synthetic_q_transformation_downstream_final
      node_id: ode_separable
      question_type: practice
      prompt: Solve y' = xy/(1+x^2).
      tested_dimensions: [trigger, method, transformation, process, calculation, final_answer]
      metadata:
        challenge_chapter_id: ode_network_mvp
    user_answer: "It is separable, but I move x and y to the same side and integrate the mixed expression."
    score_overrides:
      trigger: 86
      method: 84
      transformation: 18
      process: 35
      calculation: 25
      final_answer: 0
    expected_pass_state: fail
    expected_root_cause: transformation_error
    expected_primary_errors: [transformation_error]
    expected_derived_errors: [process_gap, calculation_error]
    expected_recommended_action: transformation_drill
    expected_repair_target_node_id: ode_separable.transformation
    expected_confidence_band: medium

  - id: synthetic_missing_initial_value_math_validator
    category: condition_miss
    purpose: Initial-value task stopped at a general solution.
    scoring_path: math_validator
    question:
      id: synthetic_q_missing_initial_value_math_validator
      node_id: ode_first_order_linear
      question_type: practice
      prompt: Solve the IVP y' = y, y(0)=2.
      expected_answer: y=2e^x
      tested_dimensions: [final_answer, process]
      metadata:
        requires_initial_condition: true
    user_answer: "y=C e^x"
    expected_pass_state: fail
    expected_root_cause: condition_miss
    expected_primary_errors: [condition_miss]
    expected_derived_errors: []
    expected_recommended_action: condition_check
    expected_confidence_band: medium

  - id: synthetic_missing_c_math_validator
    category: missing_constant
    purpose: General solution misses the arbitrary constant and should not become a method error.
    scoring_path: math_validator
    question:
      id: synthetic_q_missing_c_math_validator
      node_id: ode_separable
      question_type: practice
      prompt: Find the general solution of y'=y.
      expected_answer: y=Ce^x
      tested_dimensions: [calculation, final_answer]
      metadata:
        requires_constant: true
    user_answer: "y=e^x"
    expected_pass_state: fail
    expected_root_cause: calculation_error
    expected_primary_errors: [calculation_error]
    expected_derived_errors: []
    expected_recommended_action: calculation_repair
    expected_confidence_band: medium

  - id: synthetic_expression_weak_partial
    category: expression_weakness
    purpose: Reasoning is traceable but mathematical expression is not rigorous.
    scoring_path: manual_override
    question:
      id: synthetic_q_expression_weak_partial
      node_id: ode_basic_concept
      question_type: practice
      prompt: State the meaning of solution and write the conclusion clearly.
      tested_dimensions: [concept, expression]
    user_answer: "I know the solution is a function satisfying the equation, but the conclusion is written loosely."
    score_overrides:
      concept: 82
      expression: 35
    expected_pass_state: partial_pass
    expected_root_cause: expression_weakness
    expected_primary_errors: [expression_weakness]
    expected_derived_errors: []
    expected_recommended_action: expression_rewrite
    expected_confidence_band: medium

  - id: synthetic_knowledge_confusion
    category: knowledge_confusion
    purpose: Nearby ODE types are mixed together and should not be reduced to one local calculation slip.
    scoring_path: manual_override
    question:
      id: synthetic_q_knowledge_confusion
      node_id: ode_homogeneous_first_order
      question_type: practice
      prompt: Decide whether this first-order equation is homogeneous and choose the method.
      tested_dimensions: [concept, trigger, method, transformation]
      metadata:
        challenge_chapter_id: ode_network_mvp
    user_answer: "It is homogeneous because it has y, so I use characteristic equation and an integrating factor."
    score_overrides:
      concept: 20
      trigger: 22
      method: 25
      transformation: 30
    expected_pass_state: fail
    expected_root_cause: knowledge_confusion
    expected_primary_errors: [knowledge_confusion]
    expected_derived_errors: [concept_gap, trigger_failure, method_error, transformation_error]
    expected_recommended_action: chapter_framework_review
    expected_confidence_band: high

  - id: synthetic_surface_keyword_only
    category: rule_only_weak_signal
    purpose: Surface keyword alone should not produce a strong diagnosis or pass.
    scoring_path: rule_only_weak_signal
    question:
      id: synthetic_q_surface_keyword_only
      node_id: ode_separable
      question_type: practice
      prompt: Identify the equation type and explain the method.
      tested_dimensions: [trigger, method]
      metadata:
        challenge_chapter_id: ode_network_mvp
    user_answer: "separable"
    expected_pass_state: fail
    expected_root_cause:
    expected_primary_errors: []
    expected_derived_errors: []
    expected_recommended_action: need_more_evidence
    expected_surface_keyword_only: false
    expected_confidence_band: low

  - id: synthetic_hidden_logic_contradiction
    category: hidden_logic_contradiction
    purpose: Learner supplies the expected homogeneous substitution but also adds a contradictory method signal.
    scoring_path: rubric_plus_rule
    question:
      id: synthetic_q_hidden_logic_contradiction
      node_id: ode_homogeneous_first_order
      question_type: practice
      prompt: Explain the first-order homogeneous trigger and method.
      tested_dimensions: [trigger, method, transformation]
      rubric:
        items:
          - id: ratio_trigger
            description: Sees the ratio-form trigger.
            target_dimensions: [trigger]
            required_keywords: [ratio]
            weight: 1
            required: true
            evidence_on_hit: "Learner identified the ratio-form trigger."
            evidence_on_miss: "Learner did not identify the ratio-form trigger."
          - id: substitution_method
            description: Chooses homogeneous substitution.
            target_dimensions: [method, transformation]
            required_keywords: [y=vx]
            weight: 1
            required: true
            evidence_on_hit: "Learner chose the y=vx substitution."
            evidence_on_miss: "Learner did not choose the y=vx substitution."
      metadata:
        challenge_chapter_id: ode_network_mvp
    user_answer: "It is a ratio form, so set y=vx, but then I use integrating factor."
    expected_pass_state: fail
    expected_root_cause: method_error
    expected_primary_errors: [method_error]
    expected_derived_errors: []
    expected_recommended_action: method_comparison
    expected_logic_contradiction: true
    expected_confidence_band: high

  - id: synthetic_rubric_required_miss_final_answer_correct
    category: evidence_conflict
    purpose: Final answer match must not erase missed trigger/method rubric evidence.
    scoring_path: rubric_plus_math_validator
    question:
      id: synthetic_q_rubric_required_miss_final_answer_correct
      node_id: ode_separable
      question_type: practice
      prompt: Solve y'=2xy and explain why separation applies.
      expected_answer: y=Ce^(x^2)
      tested_dimensions: [trigger, method, final_answer]
      rubric:
        items:
          - id: trigger_reason_required
            description: Explains why variables can be separated.
            target_dimensions: [trigger]
            required_keywords: [separable, variables]
            weight: 1
            required: true
            evidence_on_hit: "Learner explained the separable trigger."
            evidence_on_miss: "Learner gave the answer without trigger evidence."
          - id: method_required
            description: Names separation of variables.
            target_dimensions: [method]
            required_keywords: [separation]
            weight: 1
            required: true
            evidence_on_hit: "Learner named the method."
            evidence_on_miss: "Learner missed the method evidence."
    user_answer: "y=Ce^(x^2)"
    expected_pass_state: false_pass
    expected_root_cause: trigger_failure
    expected_primary_errors: [trigger_failure]
    expected_derived_errors: [method_error]
    expected_recommended_action: trigger_drill
    expected_confidence_band: high

  - id: synthetic_optional_only_no_root
    category: optional_only_boundary
    purpose: Multiple optional misses should remain weak and must not manufacture a root cause.
    scoring_path: rubric
    question:
      id: synthetic_q_optional_only_no_root
      node_id: ode_separable
      question_type: practice
      prompt: Identify the method for y'=2xy.
      tested_dimensions: [method]
      rubric:
        items:
          - id: method_required
            description: Names separation of variables.
            target_dimensions: [method]
            required_keywords: [separation]
            weight: 3
            required: true
            evidence_on_hit: "Learner named the method."
            evidence_on_miss: "Learner missed the method."
          - id: optional_shortcut_phrase
            description: Optional short note about constants.
            target_dimensions: [method]
            required_keywords: [constant]
            weight: 1
            required: false
            evidence_on_hit: "Learner mentioned constant handling."
            evidence_on_miss: "Learner did not mention constant handling."
          - id: optional_domain_phrase
            description: Optional short note about nonzero y interval.
            target_dimensions: [method]
            required_keywords: [nonzero]
            weight: 1
            required: false
            evidence_on_hit: "Learner mentioned a nonzero interval."
            evidence_on_miss: "Learner did not mention a nonzero interval."
    user_answer: "I use separation of variables."
    expected_pass_state: fail
    expected_root_cause:
    expected_primary_errors: []
    expected_derived_errors: []
    expected_recommended_action: need_more_evidence
    expected_confidence_band: low

  - id: synthetic_method_name_wrong_process_correct
    category: method_name_wrong_but_process_correct
    purpose: Method label is weak, but strong downstream solution chain should lower certainty instead of overfailing.
    scoring_path: manual_override
    question:
      id: synthetic_q_method_name_wrong_process_correct
      node_id: ode_separable
      question_type: practice
      prompt: Solve y'=2xy.
      tested_dimensions: [trigger, method, transformation, process, calculation, final_answer]
      metadata:
        challenge_chapter_id: ode_network_mvp
    user_answer: "I call it linear, but I actually write dy/y=2x dx, integrate, and get y=Ce^(x^2)."
    score_overrides:
      trigger: 80
      method: 45
      transformation: 90
      process: 90
      calculation: 90
      final_answer: 95
    expected_pass_state: false_pass
    expected_root_cause:
    expected_primary_errors: []
    expected_derived_errors: []
    expected_recommended_action: need_more_evidence
    expected_confidence_band: low

  - id: synthetic_migration_failure
    category: migration_failure
    purpose: Base method evidence is acceptable but variant transfer fails.
    scoring_path: manual_override
    question:
      id: synthetic_q_migration_failure
      node_id: ode_particular_solution_form
      question_type: variant
      prompt: Choose a nonhomogeneous particular-solution form under a changed forcing term.
      tested_dimensions: [trigger, method, transformation, migration]
    user_answer: "I remember the ordinary form but cannot adapt it when resonance appears."
    score_overrides:
      trigger: 82
      method: 80
      transformation: 78
      migration: 20
    expected_pass_state: fail
    expected_root_cause: migration_failure
    expected_primary_errors: [migration_failure]
    expected_derived_errors: []
    expected_recommended_action: variant_training
    expected_confidence_band: medium

  - id: synthetic_synthesis_failure
    category: synthesis_failure
    purpose: Application/modeling task fails because the learner cannot decompose the problem.
    scoring_path: manual_override
    question:
      id: synthetic_q_synthesis_failure
      node_id: ode_application_modeling
      question_type: exam
      prompt: Build an ODE model from a word problem and solve it.
      tested_dimensions: [concept, trigger, method, process, expression]
    user_answer: "I do not know which quantities form the equation, so I try random formulas."
    score_overrides:
      concept: 45
      trigger: 20
      method: 25
      process: 20
      expression: 35
    expected_pass_state: fail
    expected_root_cause: synthesis_failure
    expected_primary_errors: [synthesis_failure]
    expected_derived_errors: [trigger_failure, method_error, process_gap]
    expected_recommended_action: chapter_framework_review
    expected_confidence_band: medium
