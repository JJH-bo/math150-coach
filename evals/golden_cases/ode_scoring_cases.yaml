  category: complete_correct
  scoring_path: manual_override
  title: 完全正确
  question:
    id: q_ode_sep_001
    node_id: ode_separable
    question_type: diagnostic
    prompt: 求解 dy/dx = 2xy，并写出通解。
  user_answer: 先分离变量 dy/y = 2x dx，积分得 ln|y| = x^2 + C，因此 y = Ce^{x^2}。
  expected_scores:
    concept: 90
    trigger: 92
    method: 95
    transformation: 95
    process: 92
    calculation: 95
    final_answer: 95
    expression: 90
    migration: null
  expected_errors: []
  expected_pass_state: pass
  expected_rollback_behavior:
    rollback_level: null
    forward_level: p3_strong
    target_nodes: []
    should_not_return_all_prerequisites: true
    explanation: 无主错因，可正常推进到后继节点。
