cases:
  - id: move_false_pass_linear
    category: false_pass_blocks_forward
    scoring_path: manual_override
    question:
      id: q_move_false_pass_linear
      node_id: ode_first_order_linear
      question_type: diagnostic
      prompt: "Solve y' + y = e^x."
      tested_dimensions: [trigger, method, process, calculation, final_answer]
    user_answer: "y = 1/2 e^x + C e^-x, with no trigger or method explanation."
    score_overrides:
      trigger: 20
      method: 25
      process: 30
      calculation: 82
      final_answer: 95
    expected_pass_state: false_pass
    expected_root_cause: trigger_failure
    expected_rollback_level: r1_internal
    expected_forward_level: p0_none
    expected_next_action_type: trigger_drill
    should_not_return_all_prerequisites: true
    should_not_strong_forward: true
    must_include_target_node: ode_first_order_linear

