lab_id: ode_real_attempt_lab_alpha
chapter_id: ode_network_mvp
purpose: Seed cases for calibrating scoring and diagnosis on realistic learner attempts.
status: draft_seed

cases:
  - case_id: ode.real_attempt.separable_transform_001
    node_id: ode_separable.transformation
    prompt_intent: Solve a separable equation after identifying the variable split.
    learner_answer: "This is separable. dy/dx = x y, so dy = xy dx, integrate both sides: y = x^2 y / 2 + C."
    learner_self_explanation: "I moved dx over and integrated. I think y can stay on the right."
    expected_primary_error: transformation_error
    expected_repair_target: ode_separable.transformation
    human_coaching_note: The learner recognized separability but did not divide by y before integrating. Repair variable placement before calculation.

  - case_id: ode.real_attempt.separable_constant_002
    node_id: ode_separable.expression
    prompt_intent: Give the general solution of a separable equation.
    learner_answer: "ln|y| = x^2/2, so y = e^(x^2/2)."
    learner_self_explanation: "After integrating both sides, I exponentiated to solve for y."
    expected_primary_error: expression_weakness
    expected_repair_target: ode_separable.expression
    human_coaching_note: Method and integration are mostly right, but the arbitrary constant disappeared. Repair general-solution expression habits.

  - case_id: ode.real_attempt.linear_as_separable_003
    node_id: ode_first_order_linear.trigger
    prompt_intent: Identify and solve a first-order linear equation.
    learner_answer: "y' + 2y = x is separable because y and x are both present. I write dy/y = (x - 2) dx."
    learner_self_explanation: "I saw y and x, so I tried to put y on one side and x on the other."
    expected_primary_error: trigger_failure
    expected_repair_target: ode_first_order_linear.trigger
    human_coaching_note: The learner used the wrong entry trigger. Repair recognition of standard form y' + P(x)y = Q(x).

  - case_id: ode.real_attempt.linear_standard_form_004
    node_id: ode_first_order_linear.transformation
    prompt_intent: Put a first-order linear equation into standard form before using the integrating factor.
    learner_answer: "2y' + 4y = x. P(x)=4, so the integrating factor is e^(4x)."
    learner_self_explanation: "The coefficient of y is 4, so I used it in the formula."
    expected_primary_error: transformation_error
    expected_repair_target: ode_first_order_linear.transformation
    human_coaching_note: The learner knows the integrating factor route but forgot to normalize the y' coefficient to 1.

  - case_id: ode.real_attempt.homogeneous_substitution_005
    node_id: ode_homogeneous_first_order.method
    prompt_intent: Use the homogeneous substitution for a first-order homogeneous equation.
    learner_answer: "The equation depends on y/x, so I let x = vy and then dx/dy = v + yv'."
    learner_self_explanation: "I know homogeneous equations use substitution, but I chose x=vy because y/x appears."
    expected_primary_error: method_error
    expected_repair_target: ode_homogeneous_first_order.method
    human_coaching_note: The learner identified the family but chose a substitution direction that does not match the differential form cleanly.

  - case_id: ode.real_attempt.homogeneous_confusion_006
    node_id: ode_homogeneous_first_order.concept
    prompt_intent: Distinguish first-order homogeneous equations from second-order constant-coefficient equations.
    learner_answer: "This is homogeneous, so I write the characteristic equation r^2 + r + 1 = 0."
    learner_self_explanation: "Homogeneous means the right side is zero, so I used the characteristic equation."
    expected_primary_error: knowledge_confusion
    expected_repair_target: ode_homogeneous_first_order.concept
    human_coaching_note: The learner confused two meanings of homogeneous. Repair concept distinction before method practice.

  - case_id: ode.real_attempt.trigger_weak_007
    node_id: ode_first_order_linear.expression
    prompt_intent: Explain why the integrating factor method is appropriate.
    learner_answer: "The answer is y = Ce^(-x) + x - 1."
    learner_self_explanation: "I used the formula because this kind of question looks familiar."
    expected_primary_error: expression_weakness
    expected_repair_target: ode_first_order_linear.expression
    human_coaching_note: The answer may be correct, but the learner cannot state the trigger or method reason. Repair active-output explanation.

  - case_id: ode.real_attempt.calculation_only_008
    node_id: ode_separable.calculation
    prompt_intent: Solve a separable equation with correct setup and integration.
    learner_answer: "dy/y = 2x dx, so ln|y| = x^3 + C, hence y = Ce^(x^3)."
    learner_self_explanation: "I separated variables and integrated both sides."
    expected_primary_error: calculation_error
    expected_repair_target: ode_separable.calculation
    human_coaching_note: The entry and method are right, but the integral of 2x was computed incorrectly. Do not misdiagnose this as a concept gap.
