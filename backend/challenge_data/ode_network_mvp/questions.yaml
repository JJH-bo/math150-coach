chapter_id: ode_network_mvp
questions:
  - id: ode-net-sep-concept-001
    owner_id: ode_separable.concept
    task_type: micro_node
    node_id: ode_separable.concept
    title: 判断可分离变量结构
    stem: 判断方程 dy/dx = x(1+y^2) 是否属于可分离变量方程。
    prompt_markdown: 写出判断结论，并指出 f(x) 与 g(y)。概念题可以用自己的话解释，但要说明 x 因子和 y 因子为什么能分开。
    answer_format: text
    response_step_mode: short_reasoning
    difficulty: basic
    hints_public:
      - 看右端能否写成只含 x 的因子乘只含 y 的因子。
    target_dimensions: [concept]
    rubric:
      items:
        - id: sep_concept_structure
          description: 能说明可分离变量方程的乘积结构。
          target_dimensions: [concept]
          required_keywords: [可分离, f(x), g(y)]
          weight: 1.0
          required: true
          partial_credit: true
          partial_score: 66
          evidence_on_hit: 识别出 dy/dx=f(x)g(y) 的概念结构。
          evidence_on_miss: 没有建立可分离变量方程的基本概念。

  - id: ode-net-sep-trigger-001
    owner_id: ode_separable.trigger
    task_type: micro_node
    node_id: ode_separable.trigger
    title: 可分离变量题眼识别
    stem: 给定 dy/dx = e^x/(1+y^2)。
    prompt_markdown: 判断这道题的第一入口，并说明看到哪个结构触发该判断。
    answer_format: text
    response_step_mode: short_reasoning
    difficulty: basic
    hints_public:
      - 先看是否能把右端拆成 x 因子与 y 因子。
    target_dimensions: [trigger]
    rubric:
      items:
        - id: sep_trigger_product
          description: 能从题目形式中提取可分离变量题眼。
          target_dimensions: [trigger]
          required_keywords: [可分离, e^x, 1+y^2]
          weight: 1.0
          required: true
          partial_credit: true
          partial_score: 64
          evidence_on_hit: 能根据乘积分离结构触发正确题型入口。
          evidence_on_miss: 没有形成可分离变量题眼识别能力。

  - id: ode-net-sep-method-001
    owner_id: ode_separable.method
    task_type: micro_node
    node_id: ode_separable.method
    title: 分离变量方法选择
    stem: 给定 dy/dx = xy。
    prompt_markdown: 写出第一步应采用的方法和分离变量后的形式。
    answer_format: text
    response_step_mode: short_reasoning
    difficulty: basic
    hints_public:
      - 把 y 的表达式放到 dy 一侧，x 的表达式放到 dx 一侧。
    target_dimensions: [method]
    rubric:
      items:
        - id: sep_method_separate
          description: 能选择分离变量法并写出正确分离形式。
          target_dimensions: [method]
          required_keywords: [分离变量, dy/y, xdx]
          weight: 1.0
          required: true
          partial_credit: true
          partial_score: 62
          evidence_on_hit: 能把方法选择转化为可执行的分离步骤。
          evidence_on_miss: 方法知道不清或不会落实到第一步。

  - id: ode-net-sep-transform-001
    owner_id: ode_separable.transformation
    task_type: micro_node
    node_id: ode_separable.transformation
    title: 可分离变量转化
    stem: 给定 dy/dx = 2xy/(1+x^2)。
    prompt_markdown: 将方程转化为变量已分离的形式，不要求积分。
    answer_format: text
    response_step_mode: short_reasoning
    difficulty: basic
    hints_public:
      - 先处理 y，再处理 x。
    target_dimensions: [transformation]
    rubric:
      items:
        - id: sep_transform_form
          description: 能把方程化成变量分离形式。
          target_dimensions: [transformation]
          required_keywords: [dy/y, 2x/(1+x^2), dx]
          weight: 1.0
          required: true
          evidence_on_hit: 条件转化正确，能进入积分步骤。
          evidence_on_miss: 未能稳定完成变量分离转化。

  - id: ode-net-sep-calc-001
    owner_id: ode_separable.calculation
    task_type: micro_node
    node_id: ode_separable.calculation
    title: 可分离变量计算
    stem: 求微分方程 dy/dx = 2xy 的通解。
    prompt_markdown: 完成积分计算并写出通解。
    answer_format: formula
    response_step_mode: full_solution
    difficulty: basic
    hints_public:
      - 分离后两边都可以直接积分。
    target_dimensions: [calculation, final_answer]
    expected_answer: y = C e^{x^2}
    answer_aliases:
      - y=Ce^(x^2)
      - ln|y|=x^2+C
    solution_outline: 分离变量 dy/y=2x dx，积分得 ln|y|=x^2+C，化为 y=Ce^{x^2}。
    validator_config:
      requires_constant: true
      requires_initial_condition: false
      answer_equivalence_mode: normalized
    rubric:
      items:
        - id: sep_calc_solution
          description: 能正确积分并吸收常数。
          target_dimensions: [calculation, final_answer]
          required_keywords: [ln|y|, x^2, C]
          weight: 1.0
          required: true
          evidence_on_hit: 积分与通解表达正确。
          evidence_on_miss: 变量分离后积分或常数处理不稳定。

  - id: ode-net-sep-expression-001
    owner_id: ode_separable.expression
    task_type: micro_node
    node_id: ode_separable.expression
    title: 通解表达规范
    stem: 已知 ln|y| = x^2 + C。
    prompt_markdown: 将结果改写为清晰的通解形式。
    answer_format: formula
    response_step_mode: short_reasoning
    difficulty: basic
    hints_public:
      - 指数化后把常数吸收进一个任意常数。
    target_dimensions: [expression, final_answer]
    expected_answer: y = C e^{x^2}
    answer_aliases:
      - y=Ce^(x^2)
    solution_outline: 两边指数化并吸收常数，得到 y=Ce^{x^2}。
    validator_config:
      requires_constant: true
      requires_initial_condition: false
      answer_equivalence_mode: normalized
    rubric:
      items:
        - id: sep_expression_clean
          description: 能规范表达通解。
          target_dimensions: [expression, final_answer]
          required_keywords: [y=, C, e]
          weight: 1.0
          required: true
          evidence_on_hit: 通解表达清晰且保留任意常数。
          evidence_on_miss: 通解表达不完整或常数处理不清。

  - id: ode-net-sep-macro-001
    owner_id: ode_separable.macro_challenge
    task_type: macro_challenge
    node_id: ode_separable
    title: 可分离变量综合验收
    stem: 求微分方程 (1+x^2)dy/dx = 2xy 的通解。
    prompt_markdown: 先判断类型，再写出分离形式、积分过程和通解。
    answer_format: full_solution
    response_step_mode: full_solution
    difficulty: standard
    hints_public:
      - 答案需要包含题眼、方法、分离形式和最终通解。
    target_dimensions: [trigger, method, transformation, calculation, expression, final_answer]
    expected_answer: y = C(1+x^2)
    answer_aliases:
      - ln|y|=ln(1+x^2)+C
    solution_outline: 识别可分离，写 dy/y=2x/(1+x^2)dx，积分得 y=C(1+x^2)。
    validator_config:
      requires_constant: true
      requires_initial_condition: false
      answer_equivalence_mode: normalized
    rubric:
      items:
        - id: sep_macro_trigger_method
          description: 能识别可分离入口并选择分离变量法。
          target_dimensions: [trigger, method]
          required_keywords: [可分离, 分离变量]
          weight: 0.3
          required: true
          partial_credit: true
          partial_score: 60
          evidence_on_hit: 题眼与方法选择正确。
          evidence_on_miss: 综合验收中题眼或方法不稳定。
        - id: sep_macro_transform
          description: 能写出变量分离形式。
          target_dimensions: [transformation]
          required_keywords: [dy/y, 2x/(1+x^2)]
          weight: 0.3
          required: true
          evidence_on_hit: 分离形式正确。
          evidence_on_miss: 综合验收中条件转化失败。
        - id: sep_macro_answer
          description: 能完成积分并写出通解。
          target_dimensions: [calculation, expression, final_answer]
          required_keywords: [ln, C, y=]
          weight: 0.4
          required: true
          evidence_on_hit: 计算与表达完整。
          evidence_on_miss: 综合验收中计算或表达不完整。

  - id: ode-net-linear-concept-001
