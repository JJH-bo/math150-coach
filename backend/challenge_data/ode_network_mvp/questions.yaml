  - id: ode-net-linear-transform-001
    owner_id: ode_first_order_linear.transformation
    task_type: micro_node
    node_id: ode_first_order_linear.transformation
    title: 化为标准形
    stem: 给定 x y' + y = x^2，且 x≠0。
    prompt_markdown: 将方程化为一阶线性标准形。
    answer_format: text
    response_step_mode: short_reasoning
    difficulty: basic
    hints_public:
