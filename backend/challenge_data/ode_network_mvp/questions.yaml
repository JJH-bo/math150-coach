          evidence_on_hit: 标准形转化正确。
          evidence_on_miss: 没有稳定化成一阶线性标准形。

  - id: ode-net-linear-calc-001
    owner_id: ode_first_order_linear.calculation
    task_type: micro_node
    node_id: ode_first_order_linear.calculation
    title: 一阶线性计算
    stem: 求 y' + y = e^x 的通解。
    prompt_markdown: 使用积分因子法求通解。
    answer_format: formula
    response_step_mode: full_solution
    difficulty: standard
    hints_public:
      - 积分因子是 e^x。
    target_dimensions: [calculation, final_answer]
    expected_answer: y = e^x/2 + C e^{-x}
    answer_aliases:
      - e^x y = e^{2x}/2 + C
    solution_outline: 积分因子 e^x，得 (e^x y)'=e^{2x}，积分后 y=e^x/2+Ce^{-x}。
    validator_config:
      requires_constant: true
      requires_initial_condition: false
      answer_equivalence_mode: normalized
    rubric:
      items:
        - id: linear_calc_solution
          description: 能完成积分因子计算。
          target_dimensions: [calculation, final_answer]
          required_keywords: ["(e^xy)'", "e^{2x}", C]
          weight: 1.0
          required: true
          evidence_on_hit: 积分因子计算链条正确。
          evidence_on_miss: 积分因子乘入或积分失败。

  - id: ode-net-linear-expression-001
    owner_id: ode_first_order_linear.expression
    task_type: micro_node
    node_id: ode_first_order_linear.expression
    title: 一阶线性特解表达
    stem: 已知 y' - y = e^x，y(0)=0。
    prompt_markdown: 写出满足初值条件的特解。
    answer_format: formula
    response_step_mode: full_solution
    difficulty: standard
    hints_public:
      - 不要停在含 C 的通解。
    target_dimensions: [expression, final_answer]
    expected_answer: y = x e^x
    answer_aliases:
      - y=xe^x
    solution_outline: 积分因子 e^{-x}，得 (e^{-x}y)'=1，e^{-x}y=x+C，由 y(0)=0 得 C=0。
    validator_config:
      requires_constant: false
      requires_initial_condition: true
      answer_equivalence_mode: normalized
    rubric:
      items:
        - id: linear_expression_ivp
          description: 能由初值确定特解。
          target_dimensions: [expression, final_answer]
          required_keywords: [C=0, y=xe^x]
          weight: 1.0
          required: true
          evidence_on_hit: 特解表达正确。
          evidence_on_miss: 初值处理或特解表达不完整。

  - id: ode-net-linear-macro-001
    owner_id: ode_first_order_linear.macro_challenge
    task_type: macro_challenge
    node_id: ode_first_order_linear
    title: 一阶线性综合验收
    stem: 求初值问题 y' - y = e^x，y(0)=0。
    prompt_markdown: 判断类型，使用积分因子，并求特解。
    answer_format: full_solution
    response_step_mode: full_solution
    difficulty: standard
    hints_public:
      - 需要说明一阶线性、积分因子和初值处理。
    target_dimensions: [trigger, method, transformation, calculation, expression, final_answer]
    expected_answer: y = x e^x
    answer_aliases:
      - y=xe^x
    solution_outline: 识别一阶线性，积分因子 e^{-x}，得 (e^{-x}y)'=1，代入初值得 y=xe^x。
    validator_config:
      requires_constant: false
      requires_initial_condition: true
      answer_equivalence_mode: normalized
    rubric:
      items:
        - id: linear_macro_trigger_method
          description: 能识别一阶线性并选积分因子法。
          target_dimensions: [trigger, method]
          required_keywords: [一阶线性, 积分因子]
          weight: 0.3
          required: true
          partial_credit: true
          partial_score: 60
          evidence_on_hit: 题眼和方法正确。
          evidence_on_miss: 综合验收中题眼或方法失败。
        - id: linear_macro_factor
          description: 能写出积分因子和乘入后的结构。
          target_dimensions: [transformation, calculation]
          required_keywords: ["e^{-x}", "(e^{-x}y)'"]
          weight: 0.4
          required: true
          evidence_on_hit: 转化和计算正确。
          evidence_on_miss: 积分因子转化或计算失败。
        - id: linear_macro_answer
          description: 能代入初值并写出特解。
          target_dimensions: [expression, final_answer]
          required_keywords: [C=0, y=xe^x]
          weight: 0.3
          required: true
          evidence_on_hit: 特解表达完整。
          evidence_on_miss: 初值或最终表达不完整。

