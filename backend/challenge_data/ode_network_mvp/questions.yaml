    prompt_markdown: 写出判断结论，并指出标准形中的 P(x) 与 Q(x)。
    answer_format: text
    response_step_mode: short_reasoning
    difficulty: basic
    hints_public:
      - 对照 y' + P(x)y = Q(x)。
    target_dimensions: [concept]
    rubric:
      items:
        - id: linear_concept_standard
          description: 能说明一阶线性标准形。
          target_dimensions: [concept]
          required_keywords: [一阶线性, P(x), Q(x)]
          weight: 1.0
          required: true
          partial_credit: true
          partial_score: 66
          evidence_on_hit: 掌握一阶线性标准结构。
          evidence_on_miss: 未建立一阶线性方程概念。

  - id: ode-net-linear-trigger-001
    owner_id: ode_first_order_linear.trigger
