  - id: ode-net-hom-calc-001
    owner_id: ode_homogeneous_first_order.calculation
    task_type: micro_node
    node_id: ode_homogeneous_first_order.calculation
    title: 齐次方程计算
    stem: 求解 dy/dx = 1 + y/x。
    prompt_markdown: 使用齐次换元求通解。
    answer_format: formula
    response_step_mode: full_solution
    difficulty: basic
    hints_public:
      - 令 y=vx 后会得到 dv/dx=1/x。
    target_dimensions: [calculation, final_answer]
    expected_answer: y = x(ln|x| + C)
    answer_aliases:
      - y=xln|x|+Cx
      - y/x=ln|x|+C
    solution_outline: 令 y=vx，代入得 xdv/dx=1，积分得 v=ln|x|+C，回代。
    validator_config:
      requires_constant: true
      requires_initial_condition: false
      answer_equivalence_mode: normalized
    rubric:
