    solution_outline: "The equation has first-order linear form y' + P(x)y = Q(x), with P(x)=1/x on x>0. It is not a standard separable-variable equation before applying the linear method. The integrating factor is x, so (xy)' = x^2, xy = x^3/3 + C, and y = x^2/3 + C/x."
