presentation:
  question_id: ode-sep-001
  node_id: ode_separable
  title: Separable equation basic check
  stem: Solve the first-order differential equation and explain the method trigger.
  prompt_markdown: "Solve dy/dx = 2xy. State why it is separable, separate variables, integrate, and give the general solution."
  answer_format: expression_with_reasoning
  response_step_mode: optional
  difficulty: basic
  hints_public:
    - Look for whether x and y factors can be separated.
trusted_scoring:
  expected_answer: "ln|y|=x^2+C"
  answer_aliases:
    - "y=Ce^(x^2)"
    - "ln|y| = x^2 + C"
  rubric:
    items:
      - id: trigger_separable
        description: Recognizes the equation can be separated into x-only and y-only factors.
        target_dimensions: [trigger]
        required_keywords: [separable]
        weight: 1.0
        required: true
        evidence_on_hit: Identified separable structure.
        evidence_on_miss: Did not identify the separable trigger.
      - id: method_separate_variables
        description: Selects separation of variables.
        target_dimensions: [method]
        required_keywords: [separate variables]
        weight: 1.0
        required: true
        evidence_on_hit: Chose separation of variables.
        evidence_on_miss: Did not state separation of variables.
      - id: transform_separated_form
        description: Moves y terms and x terms to opposite sides before integrating.
        target_dimensions: [transformation]
        required_keywords: ["dy/y", "2x"]
        weight: 1.0
        required: true
        evidence_on_hit: Wrote a separated differential form.
        evidence_on_miss: Did not show a valid separated form.
      - id: process_integrate
        description: Integrates both sides after separation.
        target_dimensions: [calculation]
        required_keywords: [integrate]
        weight: 1.0
        required: true
        evidence_on_hit: Integrated both sides.
        evidence_on_miss: Did not show the integration step.
  solution_outline: "Separate dy/y = 2x dx, integrate to ln|y| = x^2 + C."
  validator_config:
    requires_constant: true
  scoring_notes_internal: "Phase 4.0-lite catalog seed for learner-safe submit flow."
  golden_case_refs: []
  authoring_metadata:
    author: phase_4_0_lite_seed
