<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#03080d">
  <title>Math150 AI Classroom</title>
  <link rel="stylesheet" href="/classroom/styles.css">
</head>
<body>
  <div class="cosmic-noise" aria-hidden="true"></div>
  <section id="loadingView" class="loading-view" aria-live="polite">
    <span class="loading-orbit"></span>
    <p>正在建立学习宇宙</p>
  </section>

  <main id="atlasView" class="atlas-view is-hidden">
    <header class="atlas-header">
      <div>
        <p class="eyebrow">Math150 / AI Classroom</p>
        <h1 id="atlasTitle">学习宇宙</h1>
      </div>
      <div class="atlas-controls">
        <label>课程<select id="courseSelect"></select></label>
        <label>章节<select id="chapterSelect"></select></label>
        <button id="motionToggle" type="button" aria-pressed="false">降低动态</button>
      </div>
    </header>
    <section id="chapterRegion" class="chapter-region" aria-labelledby="chapterTitle">
      <div class="region-copy">
        <p class="eyebrow">Chapter region</p>
        <h2 id="chapterTitle">章节星域</h2>
        <p>每个发光目的地代表一个完整核心模块。进入后在连续课堂中展开知识。</p>
      </div>
      <div id="decorativeStars" class="decorative-stars" aria-hidden="true"></div>
      <div id="moduleDestinations" class="module-destinations"></div>
    </section>
  </main>

  <main id="classroomStage" class="classroom-stage is-hidden">
    <header class="stage-header">
      <button id="backToAtlas" class="back-button" type="button">← 返回章节星域</button>
      <div id="breadcrumbs" class="breadcrumbs"></div>
      <div class="stage-actions">
        <button id="fullscreenModel" type="button">全屏观察模型</button>
      </div>
    </header>
    <div class="classroom-grid">
      <article id="lessonContent" class="lesson-content" aria-label="课堂内容"></article>
      <aside id="modelDock" class="model-dock" aria-label="教学模型观察台">
        <header>
          <div><p class="eyebrow">Persistent model</p><h2 id="modelTitle">教学模型</h2></div>
          <button id="closeFullscreenModel" type="button" aria-label="退出全屏">退出全屏</button>
        </header>
        <div id="modelRoot" class="model-root"></div>
        <div id="modelFallback" class="model-fallback is-hidden"></div>
      </aside>
    </div>
  </main>

  <section id="emptyView" class="empty-view is-hidden">
    <p class="eyebrow">Classroom catalog</p>
    <h1>尚未发布课堂</h1>
    <p>请先通过 Studio 发布课堂包，再刷新此页面。</p>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/classroom/app.js"></script>
</body>
</html>
