<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>无穷级数 / Chapter Galaxy</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      cursor: grab;
      touch-action: none;
    }
    body.is-dragging { cursor: grabbing; }
    #cosmos-layer {
      position: fixed;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
      background: #000;
    }
    #boss-layer {
      position: fixed;
      z-index: -1;
      top: 0;
      left: 0;
      width: 130vw;
      height: 100vh;
      border: 0;
      pointer-events: none;
      background: transparent;
      opacity: 0;
      transform-origin: 50% 50%;
    }
    #boss-composite-layer {
      position: fixed;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #system-layer {
      position: fixed;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hud {
      position: fixed;
      z-index: 3;
      left: 26px;
      top: 24px;
      display: grid;
      gap: 11px;
      color: rgba(236, 225, 207, .84);
      font: 12px/1.35 Inter, "Microsoft YaHei", sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 2px 20px #000;
    }
    .hud strong { font-size: 13px; color: rgba(255, 244, 222, .92); font-weight: 600; }
    .hud span { color: rgba(198, 177, 157, .55); }
    .views { display: flex; gap: 7px; pointer-events: auto; }
    .views button {
      border: 1px solid rgba(205, 151, 98, .18);
      border-radius: 999px;
      background: rgba(12, 8, 8, .42);
      color: rgba(214, 193, 170, .54);
      padding: 7px 12px;
      cursor: pointer;
      font: inherit;
      letter-spacing: .05em;
      backdrop-filter: blur(8px);
    }
    .views button.active {
      border-color: rgba(255, 181, 98, .52);
      color: #fff0d8;
      background: rgba(86, 35, 16, .28);
      box-shadow: 0 0 24px rgba(255, 92, 24, .08);
    }
    .legend {
      position: fixed;
      z-index: 3;
      left: 28px;
      bottom: 25px;
      color: rgba(211, 187, 164, .45);
      font: 11px/1.5 Inter, "Microsoft YaHei", sans-serif;
      letter-spacing: .08em;
      pointer-events: none;
      text-shadow: 0 2px 14px #000;
    }
    .legend b { color: rgba(255, 218, 174, .72); font-weight: 500; }
    .camera-state {
      position: fixed;
      z-index: 3;
      right: 24px;
      bottom: 22px;
      padding: 8px 12px;
      border: 1px solid rgba(179, 149, 122, .12);
      border-radius: 999px;
      color: rgba(186, 172, 158, .38);
      background: rgba(4, 5, 8, .34);
      backdrop-filter: blur(8px);
      font: 10px/1 Inter, "Microsoft YaHei", sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
      transition: color .25s ease, border-color .25s ease, background .25s ease;
    }
    .camera-state.active {
      color: rgba(255, 220, 177, .78);
      border-color: rgba(255, 154, 70, .34);
      background: rgba(66, 25, 10, .26);
    }
    #system-label-layer {
      position: fixed;
      z-index: 4;
      inset: 0;
      pointer-events: none;
    }
    .scene-target-layer { position: fixed; z-index: 8; inset: 0; pointer-events: none; }
    .scene-target {
      position: absolute;
      min-width: 34px;
      min-height: 34px;
      padding: 0;
      transform: translate(-50%, -50%);
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      opacity: 0;
      pointer-events: none;
    }
    .scene-target:focus-visible {
      opacity: 1;
      border-color: rgba(255, 213, 166, .92);
      outline: 2px solid rgba(255, 112, 42, .62);
      outline-offset: 4px;
      box-shadow: 0 0 28px rgba(255, 95, 27, .62), inset 0 0 20px rgba(255, 174, 86, .20);
    }
    .system-label {
      position: absolute;
      width: min(232px, 22vw);
      padding: 8px 10px 8px 12px;
      transform: translate(-100%, -50%);
      border-left: 1px solid rgba(255, 175, 96, .34);
      border-radius: 0 7px 7px 0;
      background: linear-gradient(90deg, rgba(7, 3, 4, .72), rgba(7, 3, 4, .30) 76%, transparent);
      box-shadow: -12px 0 28px rgba(0, 0, 0, .22);
      backdrop-filter: blur(3px);
      color: rgba(255, 235, 210, .82);
      font: 11px/1.35 Inter, "Microsoft YaHei", sans-serif;
      letter-spacing: .04em;
      text-shadow: 0 2px 18px #000, 0 0 12px rgba(255, 82, 18, .28);
    }
    .system-label span { display: block; margin-top: 3px; color: rgba(204, 178, 151, .48); font-size: 9px; }
    .training-transit {
      --transit-x: 50vw;
      --transit-y: 50vh;
      position: fixed;
      z-index: 30;
      inset: 0;
      background: radial-gradient(circle at var(--transit-x) var(--transit-y), transparent 0 7%, rgba(18, 3, 1, .70) 31%, #000 72%);
      opacity: 1;
      transition: opacity 500ms ease;
      pointer-events: none;
    }
    .training-transit.is-hidden { opacity: 0; }
    .training-transit p {
      position: absolute;
      left: 50%;
      bottom: 15%;
      transform: translateX(-50%);
      color: rgba(255, 222, 186, .72);
      font: 11px/1 Inter, "Microsoft YaHei", sans-serif;
      letter-spacing: .16em;
    }
    .transit-aperture {
      position: absolute;
      left: var(--transit-x);
      top: var(--transit-y);
      width: min(43vw, 500px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #000 0 28%, #ffb35f 31%, #7b230c 35%, #170403 43%, transparent 68%);
      box-shadow: 0 0 34px rgba(255, 127, 43, .52), 0 0 150px rgba(142, 30, 12, .34);
      animation: transit-pulse 1.1s ease-in-out infinite alternate;
    }
    @keyframes transit-pulse {
      to { transform: translate(-50%, -50%) scale(1.62); filter: brightness(1.35); }
    }
    .training-observatory {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(320px, .82fr) minmax(520px, 1.18fr);
      color: rgba(245, 235, 222, .92);
      background: rgba(2, 1, 2, .64);
      backdrop-filter: blur(9px) saturate(.84);
      opacity: 1;
      transition: opacity 280ms ease;
      cursor: default;
      touch-action: auto;
    }
    .training-observatory.is-hidden { opacity: 0; pointer-events: none; }
    .training-visual {
      position: relative;
      overflow: hidden;
      border-right: 1px solid rgba(224, 161, 105, .14);
      background: radial-gradient(circle at 48% 42%, rgba(194, 66, 22, .19), transparent 34%), rgba(5, 2, 3, .92);
    }
    .training-object {
      position: absolute;
      left: 50%;
      top: 43%;
      width: clamp(160px, 20vw, 300px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #180301 0 25%, #ff9d35 29%, #6a1505 33%, #170302 41%, transparent 68%);
      box-shadow: 0 0 28px rgba(255, 105, 28, .50), 0 0 130px rgba(143, 28, 9, .31);
    }
    .training-object.is-boss { width: clamp(240px, 29vw, 430px); background: radial-gradient(circle, #000 0 29%, #bc411d 32%, #ffb155 35%, #5c1006 39%, #080102 52%, transparent 72%); }
    .training-object::before,
    .training-object::after {
      content: "";
      position: absolute;
      left: -18%;
      top: 31%;
      width: 136%;
      height: 38%;
      border: 3px solid rgba(255, 151, 66, .68);
      border-right-color: transparent;
      border-radius: 50%;
      transform: rotate(-13deg);
      filter: drop-shadow(0 0 8px #f75b18);
    }
    .training-object::after { transform: rotate(24deg) scale(.82); opacity: .34; }
    .training-identity { position: absolute; left: 30px; right: 30px; bottom: 28px; }
    .training-identity p { margin: 0; color: rgba(202, 182, 162, .58); font: 12px/1.55 Inter, "Microsoft YaHei", sans-serif; }
    .training-identity h2 { margin: 7px 0; font: 600 clamp(24px, 3vw, 40px)/1.15 Inter, "Microsoft YaHei", sans-serif; }
    .training-interface {
      min-width: 0;
      overflow: auto;
      padding: clamp(58px, 8vh, 92px) clamp(26px, 4vw, 68px) 42px;
      background: linear-gradient(90deg, rgba(7, 3, 4, .97), rgba(4, 3, 6, .91));
      font: 14px/1.7 Inter, "Microsoft YaHei", sans-serif;
    }
    .training-interface .eyebrow { margin: 0 0 8px; color: rgba(255, 172, 93, .68); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    .training-interface h3 { margin: 0 0 12px; font-size: clamp(20px, 2vw, 28px); }
    .training-interface pre {
      margin: 0 0 20px;
      padding: 18px 0 24px;
      border-bottom: 1px solid rgba(221, 157, 104, .14);
      color: rgba(226, 214, 201, .78);
      font: inherit;
      white-space: pre-wrap;
    }
    .training-interface pre strong { color: rgba(255, 226, 194, .94); font-weight: 650; }
    .training-context {
      margin: -6px 0 22px;
      padding: 12px 14px;
      border-left: 1px solid rgba(255, 157, 80, .38);
      background: rgba(78, 23, 8, .18);
      color: rgba(225, 196, 166, .68);
      font-size: 11px;
      white-space: pre-wrap;
    }
    .training-context[hidden] { display: none; }
    .training-form { display: grid; gap: 9px; }
    .training-form label { color: rgba(201, 181, 160, .54); font-size: 11px; }
    .training-form textarea {
      width: 100%;
      min-height: 86px;
      resize: vertical;
      border: 1px solid rgba(222, 158, 104, .18);
      border-radius: 5px;
      padding: 12px;
      color: #f4e8d9;
      background: rgba(0, 0, 0, .32);
      outline: none;
      font: inherit;
    }
    .training-form textarea:focus { border-color: rgba(255, 159, 73, .54); }
    .training-form button,
    .close-training {
      border: 1px solid rgba(241, 170, 103, .25);
      color: #fbe5cc;
      background: rgba(93, 30, 10, .34);
      cursor: pointer;
      font: 12px/1 Inter, "Microsoft YaHei", sans-serif;
    }
    .training-form button { min-height: 42px; margin-top: 7px; border-radius: 5px; }
    .close-training { position: absolute; z-index: 3; right: 18px; top: 18px; width: 40px; height: 40px; border-radius: 50%; font-size: 22px; }
    .training-feedback { min-height: 24px; margin-top: 14px; color: rgba(223, 187, 150, .60); font-size: 11px; }
    body.is-learning .hud,
    body.is-learning .legend,
    body.is-learning .camera-state,
    body.is-learning #system-label-layer,
    body.is-learning .scene-target-layer { opacity: 0; pointer-events: none; }
    body.is-transiting { cursor: wait; }
    body.is-sector-transition #system-layer { opacity: .18; }
    #system-layer { transition: opacity 180ms ease; }
    .render-fallback {
      position: fixed;
      z-index: 60;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 10px;
      padding: 32px;
      text-align: center;
      color: #f9e6d1;
      background: radial-gradient(circle at 50% 42%, rgba(119, 32, 10, .36), transparent 28%), #030204;
    }
    .render-fallback.is-hidden { display: none; }
    .render-fallback strong { font-size: clamp(20px, 3vw, 34px); }
    .render-fallback span { max-width: 620px; color: rgba(222, 194, 166, .62); line-height: 1.7; }
    @media (max-width: 760px) {
      .hud { left: 14px; top: 14px; right: 14px; }
      .views { flex-wrap: wrap; }
      .views button { padding: 6px 9px; }
      .system-label { width: 42vw; transform: translate(-50%, -50%); font-size: 9px; }
      .training-observatory { grid-template-columns: 1fr; grid-template-rows: minmax(190px, 32vh) minmax(0, 1fr); }
      .training-visual { border-right: 0; border-bottom: 1px solid rgba(224, 161, 105, .14); }
      .training-interface { padding: 28px 18px 32px; }
      .training-identity { left: 18px; bottom: 14px; }
      .training-identity p:last-child { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <iframe id="cosmos-layer" src="../cosmos-lab/?view=abyss&amp;embed=1" title="Approved cold deep-space sky"></iframe>
  <iframe id="boss-layer" src="../boss-lab/?view=far&amp;embed=1" title="Approved relativistic Boss"></iframe>
  <canvas id="boss-composite-layer" aria-label="Relativistic Boss optical composite"></canvas>
  <canvas id="system-layer" aria-label="Infinite-series learning systems and relativistic field links"></canvas>
  <div id="system-label-layer" aria-hidden="true"></div>
  <div class="scene-target-layer" id="scene-target-layer" role="group" aria-label="当前扇区训练目标"></div>
  <div class="hud">
    <div><strong id="chapter-title">无穷级数 / Chapter Observatory</strong><br><span id="chapter-metrics">正在装载章节星系</span></div>
    <div class="views" id="sector-navigation" aria-label="无穷级数章节扇区"></div>
  </div>
  <div class="legend"><b>黑洞中心 · 渐进扇区</b><br>点击恒星进入训练 · 拖动环绕黑洞 · 滚轮改变观察半径 · 双击复位</div>

  <div class="camera-state" id="camera-state">Boss-centered fan · Drag · Wheel · Double-click reset</div>

  <div class="training-transit is-hidden" id="training-transit" aria-hidden="true">
    <div class="transit-aperture"></div>
    <p>正在穿越知识恒星</p>
  </div>

  <section class="training-observatory is-hidden" id="training-observatory" role="dialog" aria-modal="true" aria-labelledby="training-title" aria-hidden="true" inert>
    <button class="close-training" id="close-training" type="button" aria-label="离开训练空间">×</button>
    <div class="training-visual">
      <div class="training-object" id="training-object" aria-hidden="true"></div>
      <div class="training-identity">
        <p id="training-role">Training star</p>
        <h2 id="training-title">训练节点</h2>
        <p id="training-goal">正在读取训练目标。</p>
      </div>
    </div>
    <div class="training-interface">
      <p class="eyebrow" id="training-kind">Current problem</p>
      <h3 id="training-question-title">核心训练</h3>
      <pre id="training-stem">正在读取题目。</pre>
      <div class="training-context" id="training-context" hidden></div>
      <form class="training-form" id="training-form">
        <label for="training-answer">回答</label>
        <textarea id="training-answer" rows="5" placeholder="写出判断、关键步骤和结论"></textarea>
        <label for="training-reason">关键理由</label>
        <textarea id="training-reason" rows="3" placeholder="说明为什么采用这个方法"></textarea>
        <button type="submit">保留本次作答</button>
      </form>
      <div class="training-feedback" id="training-feedback" role="status" aria-live="polite"></div>
    </div>
  </section>

  <section class="render-fallback is-hidden" id="render-fallback" role="alert">
    <strong>当前设备无法建立章节星系</strong>
    <span id="render-fallback-message">WebGL2 或着色器初始化失败。请更新浏览器或显卡驱动后重新打开。</span>
  </section>

  <script type="x-shader/x-vertex" id="fullscreen-vertex">
    #version 300 es
    precision highp float;
    out vec2 vUv;
    void main() {
      vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
      vUv = p;
      gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
    }
  </script>

  <script type="x-shader/x-fragment" id="system-fragment">
    #version 300 es
    precision highp float;
    uniform vec2 resolution;
    uniform float time;
    uniform vec4 planetData[15];
    uniform vec4 planetMeta[15];
    uniform vec4 routeA[15];
    uniform vec4 routeB[15];
    uniform vec4 routeC[15];
    uniform vec4 routeD[15];
    uniform vec4 routeMeta[15];
    uniform vec4 systemData[3];
    uniform vec4 bossData;
    out vec4 fragColor;

    const float PI = 3.141592653589793;

    mat2 rotate2(float a) {
      float c = cos(a), s = sin(a);
      return mat2(c, -s, s, c);
    }

    mat3 rotateY(float a) {
      float c = cos(a), s = sin(a);
      return mat3(c,0.0,s, 0.0,1.0,0.0, -s,0.0,c);
    }

    float hash13(vec3 p) {
      p = fract(p * 0.1031);
      p += dot(p, p.zyx + 31.32);
      return fract((p.x + p.y) * p.z);
    }

    float noise3(vec3 p) {
      vec3 i = floor(p);
      vec3 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(mix(hash13(i), hash13(i + vec3(1,0,0)), f.x),
            mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y),
        mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x),
            mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y), f.z);
    }

    float fbm3(vec3 p) {
      float value = 0.0;
      float amplitude = 0.52;
      mat3 m = mat3(0.00,0.80,0.60, -0.80,0.36,-0.48, -0.60,-0.48,0.64);
      for (int i = 0; i < 5; i++) {
        value += noise3(p) * amplitude;
        p = m * p * 2.03 + vec3(7.1, 11.7, 3.9);
        amplitude *= 0.49;
      }
      return value;
    }

    vec2 cubicBezier(vec2 a, vec2 b, vec2 c, vec2 d, float t) {
      float s = 1.0 - t;
      return s*s*s*a + 3.0*s*s*t*b + 3.0*s*t*t*c + t*t*t*d;
    }

    vec2 curveDistance(vec2 p, vec2 a, vec2 b, vec2 c, vec2 d) {
      float best = 100.0;
      float bestT = 0.0;
      vec2 previous = a;
      for (int i = 1; i <= 24; i++) {
        float t = float(i) / 24.0;
        vec2 current = cubicBezier(a, b, c, d, t);
        vec2 segment = current - previous;
        float h = clamp(dot(p - previous, segment) / max(dot(segment, segment), 1e-6), 0.0, 1.0);
        float distanceSquared = dot(p - previous - segment * h, p - previous - segment * h);
        if (distanceSquared < best) {
          best = distanceSquared;
          bestT = (float(i - 1) + h) / 24.0;
        }
        previous = current;
      }
      return vec2(sqrt(best), bestT);
    }

    void routeField(
      vec2 p, vec2 a, vec2 b, vec2 c, vec2 d, float seed, float terminal, float energyScale,
      inout vec3 emission, inout float coverage
    ) {
      vec2 boundsMin = min(min(a, b), min(c, d)) - vec2(0.16);
      vec2 boundsMax = max(max(a, b), max(c, d)) + vec2(0.16);
      if (p.x < boundsMin.x || p.y < boundsMin.y || p.x > boundsMax.x || p.y > boundsMax.y) return;

      vec3 localEmission = vec3(0.0);
      float localCoverage = 0.0;
      vec2 samplePoint = p;
      vec2 boss = bossData.xy;
      float opticalFocus = clamp(bossData.z / 1.58, 0.86, 1.28);
      float bossDistance = length((p - boss) * vec2(1.0, 0.82)) / opticalFocus;
      float gravity = terminal * (1.0 - smoothstep(0.25, 0.90, bossDistance));
      float bend = gravity * 0.32 / (bossDistance + 0.31);
      samplePoint = boss + rotate2(-bend) * (samplePoint - boss);

      vec2 warp = vec2(
        fbm3(vec3(samplePoint * 2.9, seed + time * 0.021)),
        fbm3(vec3(samplePoint.yx * 3.4, seed + 4.7 - time * 0.017))
      ) - 0.5;
      vec2 field = curveDistance(samplePoint + warp * 0.010, a, b, c, d);
      float distanceToCurve = field.x;
      float t = field.y;
      float edgeFade = smoothstep(0.0, 0.10, t) * (1.0 - smoothstep(0.90, 1.0, t));
      float turbulence = fbm3(vec3(t * 7.0, seed, time * 0.045));
      float torn = smoothstep(0.24, 0.69, turbulence + 0.13 * sin(t * 53.0 + seed * 8.0));

      float laneWidth = mix(0.088, 0.054, t) * (0.76 + turbulence * 0.50) * mix(1.0, 1.22, terminal);
      float lane = exp(-distanceToCurve * distanceToCurve / max(laneWidth * laneWidth, 1e-5));
      lane *= edgeFade * (0.14 + torn * 0.86);

      float shearNoise = fbm3(vec3(t * 18.0, distanceToCurve * 34.0 + seed, time * 0.055));
      float ribbonPhase = distanceToCurve * 188.0 + t * 41.0 + shearNoise * 8.0 + seed;
      float ribbons = pow(max(0.0, 0.5 + 0.5 * sin(ribbonPhase)), 7.0);
      ribbons *= exp(-distanceToCurve * distanceToCurve / 0.00115) * edgeFade;

      float wiggleA = 0.0070 * sin(t * 61.0 + seed * 4.1 + time * 0.32);
      float wiggleB = 0.0115 * sin(t * 37.0 - seed * 2.3 - time * 0.21);
      float strandA = exp(-pow(abs(distanceToCurve - abs(wiggleA)), 2.0) / 0.000020);
      float strandB = exp(-pow(abs(distanceToCurve - abs(wiggleB)), 2.0) / 0.000034);
      float core = exp(-distanceToCurve * distanceToCurve / 0.000012);
      float breakup = smoothstep(0.30, 0.66, fbm3(vec3(t * 13.0, seed + 9.0, time * 0.09)));
      float fibers = (core * 0.76 + strandA * 0.45 + strandB * 0.25 + ribbons * 0.54) *
        edgeFade * (0.20 + breakup * 0.80);

      float flowT = mix(t, pow(max(t, 0.001), 0.62), gravity);
      float phase = fract(flowT * 2.6 - time * (0.10 + seed * 0.004) * (1.0 + gravity * 2.4) + seed * 0.21);
      float pulse = exp(-pow((phase - 0.08) / 0.055, 2.0));
      pulse += 0.55 * exp(-pow((phase - 0.51) / 0.035, 2.0));
      pulse *= core * edgeFade * (0.52 + turbulence * 0.48);

      vec3 cool = vec3(0.075, 0.010, 0.004);
      vec3 warm = vec3(1.35, 0.21, 0.026);
      vec3 redshifted = vec3(0.92, 0.012, 0.002);
      vec3 hot = vec3(5.4, 1.25, 0.20);
      vec3 routeColor = mix(cool, warm, smoothstep(0.12, 0.82, t + terminal * 0.26));
      routeColor = mix(routeColor, redshifted, gravity * 0.76);
      localEmission += routeColor * (lane * 0.52 + fibers * 0.86);
      localEmission += mix(hot, vec3(2.8, 0.07, 0.006), gravity * 0.82) * pulse * (0.68 + terminal * 0.42);
      localEmission += vec3(0.42, 0.028, 0.006) * ribbons * (0.35 + terminal * 0.24);
      localCoverage = max(localCoverage, clamp(lane * 0.24 + fibers * 0.58 + pulse * 0.46, 0.0, 0.78));

      if (terminal > 0.5) {
        vec2 secondaryPoint = boss + rotate2(bend * 1.34) * (p - boss);
        vec2 secondary = curveDistance(secondaryPoint, a, b, c, d);
        float secondaryArc = exp(-secondary.x * secondary.x / 0.000020) *
          smoothstep(0.44, 0.86, secondary.y) * (1.0 - smoothstep(0.76, 0.92, secondary.y)) *
          (1.0 - smoothstep(0.31, 0.72, bossDistance));
        localEmission += vec3(1.7, 0.19, 0.018) * secondaryArc * 0.30;
        localCoverage = max(localCoverage, secondaryArc * 0.20);
      }

      float horizonMask = mix(1.0, smoothstep(0.21, 0.30, bossDistance), terminal);
      emission += localEmission * energyScale * horizonMask;
      coverage = max(coverage, localCoverage * energyScale * horizonMask);
    }

    void starField(
      vec2 p, vec2 center, float radius, float seed, float heat, float energyScale,
      inout vec3 emission, inout float coverage
    ) {
      vec2 local = (p - center) / radius;
      float radial = length(local);
      if (radial > 2.35) return;

      float angle = atan(local.y, local.x);
      float height = max(radial - 1.0, 0.0);
      vec3 coronaDirection = vec3(cos(angle), sin(angle), seed * 0.13);
      float broad = fbm3(coronaDirection * 2.6 + vec3(time * 0.012, -time * 0.009, seed));
      float fine = fbm3(coronaDirection * 7.9 + vec3(-time * 0.018, time * 0.011, seed + 3.0));
      float lobes = pow(max(0.0, 0.5 + 0.5 * sin(angle * (4.0 + mod(seed, 3.0)) + broad * 5.2)), 4.0);
      float coronaFade = exp(-height * 4.9) * (1.0 - smoothstep(0.75, 1.28, height));
      float corona = coronaFade * smoothstep(0.30, 0.68, broad * 0.7 + fine * 0.3) * (0.055 + lobes * 0.20);
      vec3 coronaColor = mix(vec3(0.32, 0.006, 0.001), vec3(1.65, 0.20, 0.018), lobes);
      emission += coronaColor * corona * energyScale;
      coverage = max(coverage, corona * 0.24 * energyScale);

      float chromosphere = exp(-height * 65.0) * step(1.0, radial) * (0.40 + fine * 0.60);
      emission += vec3(3.2, 0.12, 0.007) * chromosphere * energyScale;
      coverage = max(coverage, chromosphere * 0.58 * energyScale);

      if (radial < 1.0) {
        float z = sqrt(max(0.0, 1.0 - dot(local, local)));
        vec3 normal = normalize(vec3(local, z));
        vec3 surface = rotateY(seed + time * (0.024 + seed * 0.0008)) * normal;
        vec3 warp = vec3(
          fbm3(surface * 2.2 + vec3(time * 0.010, seed, 0.0)),
          fbm3(surface * 2.4 + vec3(seed, -time * 0.008, 3.7)),
          fbm3(surface * 2.1 + vec3(5.1, seed, time * 0.007))
        ) - 0.5;
        vec3 plasma = normalize(surface + warp * 0.20);

        float convection = fbm3(plasma * 3.2 + vec3(time * 0.008, -time * 0.005, seed));
        float meso = fbm3(plasma * 7.4 + warp * 1.8 - vec3(time * 0.012, seed, time * 0.007));
        float granuleA = noise3(plasma * 34.0 + warp * 5.8 + vec3(time * 0.018, -time * 0.011, seed));
        float granuleB = noise3(plasma * 72.0 - warp * 3.7 + vec3(-time * 0.025, time * 0.016, seed + 9.4));
        float granuleField = granuleA * 0.62 + granuleB * 0.23 + meso * 0.15;
        float granule = smoothstep(0.24, 0.74, granuleField);
        float cellHeat = clamp(0.10 + granule * 0.59 + granuleB * 0.12 + meso * 0.18 + convection * 0.11, 0.0, 1.0);

        vec3 spotAxis = normalize(vec3(sin(seed * 1.7), cos(seed * 2.1) * 0.55, 0.86));
        float angular = 1.0 - dot(plasma, spotAxis);
        float torn = fbm3(plasma * 7.0 + vec3(seed, -seed * .31, time * .01));
        float spot = 1.0 - smoothstep(0.0045, 0.010, angular + (torn - 0.5) * 0.005);
        float facula = smoothstep(0.018, 0.011, angular + (torn - 0.5) * 0.005) * (1.0 - spot);

        float mu = clamp(z, 0.0, 1.0);
        float limb = 0.27 + 0.73 * pow(mu, 0.46);
        vec3 laneColor = vec3(0.052, 0.0010, 0.00035);
        vec3 emberColor = mix(vec3(0.33, 0.011, 0.0007), vec3(0.48, 0.020, 0.0012), heat);
        vec3 hotColor = mix(vec3(1.55, 0.17, 0.009), vec3(2.20, 0.34, 0.022), heat);
        vec3 whiteHot = mix(vec3(3.5, 0.72, 0.07), vec3(5.4, 1.40, 0.18), heat);
        vec3 surfaceColor = mix(laneColor, emberColor, smoothstep(0.08, 0.42, cellHeat));
        surfaceColor = mix(surfaceColor, hotColor, smoothstep(0.40, 0.78, cellHeat));
        surfaceColor = mix(surfaceColor, whiteHot, pow(smoothstep(0.75, 1.0, cellHeat), 2.2));
        surfaceColor *= (0.56 + convection * 0.76) * (0.78 + meso * 0.32) * limb;
        surfaceColor += vec3(0.90, 0.09, 0.004) * pow(granule, 3.0) * (0.48 + granuleB * 0.52);
        surfaceColor = mix(surfaceColor, vec3(0.065, 0.0010, 0.0012), spot * 0.84);
        surfaceColor += vec3(1.35, 0.12, 0.006) * facula * pow(1.0 - mu, 0.58);
        surfaceColor += vec3(1.75, 0.060, 0.004) * pow(1.0 - mu, 7.0) * (0.46 + meso * 0.54);

        float edge = 1.0 - smoothstep(1.0 - 1.8 / max(radius * resolution.y, 1.0), 1.0, radial);
        surfaceColor *= mix(0.62, 1.0, energyScale);
        emission = mix(emission, surfaceColor, edge);
        coverage = max(coverage, edge);
      }
    }

    void main() {
      vec2 p = (2.0 * gl_FragCoord.xy - resolution.xy) / resolution.y;
      vec3 emission = vec3(0.0);
      float coverage = 0.0;

      for (int i = 0; i < 3; i++) {
        vec2 center = systemData[i].xy;
        float radius = max(systemData[i].z, 0.10);
        float energyScale = systemData[i].w;
        vec2 local = (p - center) / vec2(radius * 1.18, radius);
        float envelope = exp(-dot(local, local) * 1.38);
        float dust = smoothstep(0.58, 0.90,
          fbm3(vec3(p * vec2(1.7, 2.5) + vec2(float(i) * 3.7), time * 0.006))) * envelope;
        float cloudTear = smoothstep(0.49, 0.79,
          fbm3(vec3(p * 2.9 + vec2(time * 0.007, -time * 0.004), 12.0 + float(i) * 5.0))) * envelope;
        emission += vec3(0.16, 0.018, 0.004) * dust * energyScale * 0.22;
        emission += vec3(0.11, 0.007, 0.002) * cloudTear * energyScale * 0.12;
        coverage = max(coverage, (dust + cloudTear) * energyScale * 0.035);
      }

      for (int i = 0; i < 15; i++) {
        routeField(
          p,
          routeA[i].xy,
          routeB[i].xy,
          routeC[i].xy,
          routeD[i].xy,
          routeMeta[i].x,
          routeMeta[i].y,
          routeMeta[i].z,
          emission,
          coverage
        );
      }

      vec2 bossLocal = (p - bossData.xy) * vec2(1.0, 0.84);
      float opticalFocus = clamp(bossData.z / 1.58, 0.86, 1.28);
      float bossRadius = length(bossLocal) / opticalFocus;
      float bossAngle = atan(bossLocal.y, bossLocal.x);
      float spiralNoise = fbm3(vec3(
        bossAngle * 0.92 - time * 0.075,
        bossRadius * 5.6 - time * 0.046,
        21.4
      ));
      float spiralBands = pow(max(0.0, 0.5 + 0.5 * sin(
        bossAngle * 3.0 - bossRadius * 21.0 - time * 0.43 + spiralNoise * 5.4
      )), 5.0);
      float infallWindow = smoothstep(0.31, 0.47, bossRadius) *
        (1.0 - smoothstep(1.18, 1.92, bossRadius));
      float dustBreakup = smoothstep(0.57, 0.82, spiralNoise);
      float infallDust = spiralBands * dustBreakup * infallWindow;
      float inwardPulse = pow(max(0.0, 0.5 + 0.5 * sin(
        bossRadius * 31.0 + time * 1.35 - bossAngle * 2.0
      )), 9.0) * infallDust;
      vec3 dustColor = mix(vec3(0.16, 0.006, 0.001), vec3(1.25, 0.13, 0.008),
        1.0 - smoothstep(0.36, 1.35, bossRadius));
      emission += dustColor * infallDust * 0.24;
      emission += vec3(2.4, 0.34, 0.035) * inwardPulse * 0.22;
      coverage = max(coverage, infallDust * 0.075);

      for (int i = 0; i < 15; i++) {
        starField(
          p,
          planetData[i].xy,
          planetData[i].z,
          planetMeta[i].x,
          planetMeta[i].y,
          planetData[i].w,
          emission,
          coverage
        );
      }

      vec2 pixelGrid = floor(gl_FragCoord.xy / 3.0);
      float sparkleSeed = hash13(vec3(pixelGrid, 18.2));
      float sparkle = smoothstep(0.9991, 1.0, sparkleSeed) * (0.25 + 0.75 * hash13(vec3(pixelGrid.yx, 2.0)));
      emission += vec3(0.45, 0.25, 0.16) * sparkle * 0.18;
      coverage = max(coverage, sparkle * 0.16);

      float vignette = 1.0 - smoothstep(0.78, 1.92, length(p * vec2(0.60, 1.0)));
      emission *= 0.74 + vignette * 0.26;
      if (any(isnan(emission)) || any(isinf(emission))) emission = vec3(0.0);
      emission = max(emission, vec3(0.0));
      fragColor = vec4(emission, clamp(coverage, 0.0, 1.0));
    }
  </script>

  <script type="x-shader/x-fragment" id="blur-fragment">
    #version 300 es
    precision highp float;
    uniform sampler2D source;
    uniform vec2 texel;
    uniform vec2 direction;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec3 sum = vec3(0.0);
      float alpha = 0.0;
      float weights[5] = float[](0.227027, 0.1945946, 0.1216216, 0.054054, 0.016216);
      vec4 center = texture(source, vUv);
      sum += max(center.rgb - threshold, 0.0) * weights[0];
      alpha = center.a;
      for (int i = 1; i < 5; i++) {
        vec2 offset = direction * texel * float(i);
        vec4 a = texture(source, vUv + offset);
        vec4 b = texture(source, vUv - offset);
        sum += (max(a.rgb - threshold, 0.0) + max(b.rgb - threshold, 0.0)) * weights[i];
        alpha = max(alpha, max(a.a, b.a) * 0.45);
      }
      fragColor = vec4(sum, alpha);
    }
  </script>

  <script type="x-shader/x-fragment" id="composite-fragment">
    #version 300 es
    precision highp float;
    uniform sampler2D sceneTexture;
    uniform sampler2D bloomTexture;
    in vec2 vUv;
    out vec4 fragColor;
    vec3 aces(vec3 x) {
      const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
      return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
    }
    void main() {
      vec4 scene = texture(sceneTexture, vUv);
      vec3 bloom = texture(bloomTexture, vUv).rgb;
      vec3 mapped = pow(aces(scene.rgb + bloom * 0.62), vec3(1.0 / 2.2));
      float alpha = clamp(scene.a + max(max(bloom.r, bloom.g), bloom.b) * 0.055, 0.0, 1.0);
      fragColor = vec4(mapped * alpha, alpha);
    }
  </script>

  <script type="module">
    import { createObservatoryCamera, createSceneFrame } from './observatory-camera.mjs';
    import fallbackChapter from './infinite-series-data.mjs';
    import { loadChapterData } from './chapter-data-loader.mjs';
    import {
      buildInfiniteSeriesSectors,
      createSectorSceneConfig,
      pickSceneTarget,
    } from './infinite-series-scene.mjs';

    let chapter = null;
    let chapterLoadError = null;
    try {
      chapter = await loadChapterData({
        search: window.location.search,
        fallbackChapter,
      });
    } catch (error) {
      chapterLoadError = error;
    }

    (() => {
      const canvas = document.querySelector('#system-layer');
      const cosmosFrame = document.querySelector('#cosmos-layer');
      const bossFrame = document.querySelector('#boss-layer');
      const bossComposite = document.querySelector('#boss-composite-layer');
      const bossContext = bossComposite.getContext('2d', { alpha: true });
      const systemLabelLayer = document.querySelector('#system-label-layer');
      const sceneTargetLayer = document.querySelector('#scene-target-layer');
      const sectorNavigation = document.querySelector('#sector-navigation');
      const chapterTitle = document.querySelector('#chapter-title');
      const chapterMetrics = document.querySelector('#chapter-metrics');
      const trainingTransit = document.querySelector('#training-transit');
      const trainingObservatory = document.querySelector('#training-observatory');
      const closeTraining = document.querySelector('#close-training');
      const trainingObject = document.querySelector('#training-object');
      const trainingRole = document.querySelector('#training-role');
      const trainingTitle = document.querySelector('#training-title');
      const trainingGoal = document.querySelector('#training-goal');
      const trainingKind = document.querySelector('#training-kind');
      const trainingQuestionTitle = document.querySelector('#training-question-title');
      const trainingStem = document.querySelector('#training-stem');
      const trainingContext = document.querySelector('#training-context');
      const trainingForm = document.querySelector('#training-form');
      const trainingAnswer = document.querySelector('#training-answer');
      const trainingReason = document.querySelector('#training-reason');
      const trainingFeedback = document.querySelector('#training-feedback');
      const renderFallback = document.querySelector('#render-fallback');
      const renderFallbackMessage = document.querySelector('#render-fallback-message');
      const showRenderFailure = (message) => {
        renderFallbackMessage.textContent = message;
        renderFallback.classList.remove('is-hidden');
      };
      if (!chapter) {
        showRenderFailure(
          `章节知识网数据加载失败：${chapterLoadError?.message || '未知错误'}。请确认预览会话或章节发布状态。`,
        );
        return;
      }
      const gl = canvas.getContext('webgl2', {
        alpha: true,
        antialias: false,
        premultipliedAlpha: true,
        powerPreference: 'high-performance',
      });
      if (!gl) {
        showRenderFailure('当前浏览器无法启用 WebGL2，章节星系未开始渲染。请更新浏览器或显卡驱动后重试。');
        return;
      }
      gl.getExtension('EXT_color_buffer_float');

      const cameraState = document.querySelector('#camera-state');
      const observatory = createObservatoryCamera();
      const sectors = buildInfiniteSeriesSectors(chapter);
      let activeSectorId = sectors[0]?.id;
      let sceneConfig = createSectorSceneConfig(chapter, activeSectorId);
      let sceneFrame = createSceneFrame(observatory, innerWidth / Math.max(innerHeight, 1), sceneConfig);
      let lastFocusedElement = null;
      const interaction = {
        dragging: false,
        moved: false,
        lastPointer: [0, 0],
        startPointer: [0, 0],
        clickTimer: 0,
        transitTimer: 0,
      };

      const updateObservatory = (milliseconds) => {
        observatory.update(milliseconds);
        sceneFrame = createSceneFrame(observatory, innerWidth / Math.max(innerHeight, 1), sceneConfig);
        renderSystemLabels();
        renderSceneTargets();
        const snapshot = observatory.snapshot();
        cosmosFrame.contentWindow?.cosmosCamera?.setObservatory?.({
          yaw: observatory.current.azimuth,
          pitch: observatory.current.elevation,
          distance: observatory.current.radius,
        });
        cosmosFrame.contentWindow?.cosmosCamera?.setGravityLens?.({
          center: sceneFrame.boss.center,
          radius: sceneFrame.boss.lensRadius,
          strength: sceneFrame.boss.lensStrength,
        });
        const active = Math.abs(snapshot.azimuth) > 0.08 || Math.abs(snapshot.elevation) > 0.08 ||
          Math.abs(snapshot.radius - 12.36) > 0.01;
        cameraState.classList.toggle('active', active);
        cameraState.textContent =
          `Boss orbit · azimuth ${snapshot.azimuth.toFixed(1)}° · elevation ${snapshot.elevation.toFixed(1)}° · radius ${snapshot.radius.toFixed(2)}`;
      };

      window.observatoryCamera = {
        reset: () => observatory.reset(true),
        setImmediate: ({ azimuth = 0, elevation = 0, radius = 12.36 } = {}) =>
          observatory.setState({
            azimuth: azimuth * Math.PI / 180,
            elevation: elevation * Math.PI / 180,
            radius,
          }, true),
        snapshot: () => ({ ...observatory.snapshot(), boss: sceneFrame.boss.center.map((value) => Number(value.toFixed(4))) }),
      };

      const renderSectorNavigation = () => {
        sectorNavigation.replaceChildren();
        sectors.forEach((sector) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = sector.title;
          button.classList.toggle('active', sector.id === activeSectorId);
          button.addEventListener('click', () => activateSector(sector.id));
          sectorNavigation.append(button);
        });
      };

      const activateSector = (sectorId) => {
        if (sectorId === activeSectorId || document.body.classList.contains('is-learning') || document.body.classList.contains('is-transiting')) return;
        const sector = sectors.find((candidate) => candidate.id === sectorId);
        if (!sector) return;
        activeSectorId = sectorId;
        sceneConfig = createSectorSceneConfig(chapter, activeSectorId);
        document.body.classList.add('is-sector-transition');
        window.setTimeout(() => document.body.classList.remove('is-sector-transition'), 190);
        renderSectorNavigation();
        updateChapterMetrics();
      };

      const updateChapterMetrics = () => {
        chapterTitle.textContent = `${chapter.title} / Chapter Observatory`;
        chapterMetrics.textContent =
          `${sceneConfig.title} · ${sceneConfig.systems.length} 个核心星系 · ${sceneConfig.planetCount} 颗训练恒星 · 全章 ${chapter.metrics.systemCount} 系 / ${chapter.metrics.planetCount} 星 · 1 Boss`;
      };

      const renderSystemLabels = () => {
        while (systemLabelLayer.children.length < sceneFrame.systems.length) {
          const label = document.createElement('div');
          label.className = 'system-label';
          const title = document.createElement('strong');
          const meta = document.createElement('span');
          label.append(title, meta);
          systemLabelLayer.append(label);
        }
        [...systemLabelLayer.children].forEach((label, index) => {
          const system = sceneFrame.systems[index];
          label.hidden = !system;
          if (!system) return;
          const x = innerWidth * .5 + system.center[0] * innerHeight * .5;
          const y = innerHeight * .5 - system.center[1] * innerHeight * .5;
          const clusterReach = Math.max(70, system.radius * innerHeight * .62);
          if (innerWidth <= 760) {
            label.style.left = `${Math.min(innerWidth - 92, Math.max(92, x))}px`;
            label.style.top = `${Math.max(112, y - clusterReach)}px`;
          } else {
            label.style.left = `${Math.min(innerWidth - 24, Math.max(252, x - clusterReach))}px`;
            label.style.top = `${Math.min(innerHeight - 58, Math.max(116, y))}px`;
          }
          label.querySelector('strong').textContent = system.title;
          label.querySelector('span').textContent = `${system.planets.length} 个训练节点 · 第 ${system.learningOrder} 模块`;
        });
      };

      const renderSceneTargets = () => {
        const targets = [...sceneFrame.planets, { ...sceneFrame.boss, isBoss: true }];
        while (sceneTargetLayer.children.length < targets.length) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'scene-target';
          button.addEventListener('click', () => {
            if (interactionLocked()) return;
            const target = [...sceneFrame.planets, sceneFrame.boss]
              .find((candidate) => candidate?.id === button.dataset.targetId);
            if (!target) return;
            openTrainingTransit(target, {
              x: innerWidth * .5 + target.center[0] * innerHeight * .5,
              y: innerHeight * .5 - target.center[1] * innerHeight * .5,
            });
          });
          sceneTargetLayer.append(button);
        }
        [...sceneTargetLayer.children].forEach((button, index) => {
          const target = targets[index];
          button.hidden = !target;
          if (!target) return;
          const x = innerWidth * .5 + target.center[0] * innerHeight * .5;
          const y = innerHeight * .5 - target.center[1] * innerHeight * .5;
          const visualRadius = target.isBoss ? target.lensRadius : target.radius;
          const size = Math.max(34, Math.min(86, visualRadius * innerHeight * 2.05));
          button.dataset.targetId = target.id;
          button.setAttribute('aria-label', `${target.isBoss ? '章节 Boss' : '训练节点'}：${target.title}`);
          button.style.left = `${x}px`;
          button.style.top = `${y}px`;
          button.style.width = `${size}px`;
          button.style.height = `${size}px`;
        });
      };

      const openTrainingTransit = (target, point) => {
        if (!target || document.body.classList.contains('is-learning') || document.body.classList.contains('is-transiting')) return;
        window.clearTimeout(interaction.transitTimer);
        lastFocusedElement = document.activeElement instanceof HTMLElement ? document.activeElement : null;
        document.body.classList.add('is-transiting');
        trainingTransit.style.setProperty('--transit-x', `${point.x}px`);
        trainingTransit.style.setProperty('--transit-y', `${point.y}px`);
        trainingTransit.classList.remove('is-hidden');
        trainingTransit.setAttribute('aria-hidden', 'false');
        const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 80 : 920;
        interaction.transitTimer = window.setTimeout(() => {
          populateTraining(target);
          trainingTransit.classList.add('is-hidden');
          trainingTransit.setAttribute('aria-hidden', 'true');
          document.body.classList.remove('is-transiting');
          document.body.classList.add('is-learning');
          trainingObservatory.classList.remove('is-hidden');
          trainingObservatory.setAttribute('aria-hidden', 'false');
          trainingObservatory.removeAttribute('inert');
          trainingAnswer.focus({ preventScroll: true });
        }, delay);
      };

      const formatFailureRouting = () => {
        const planetTitles = new Map(chapter.systems.flatMap((system) =>
          system.planets.map((planet) => [planet.id, planet.title])));
        return String(chapter.boss.failureRouting || '')
          .split(';')
          .map((route) => {
            const [reason, targetId] = route.split(/\s*->\s*/, 2);
            if (!reason?.trim()) return '';
            return `${reason.trim()} → ${planetTitles.get(targetId?.trim()) || '对应训练节点'}`;
          })
          .filter(Boolean)
          .join('\n');
      };

      const populateTraining = (target) => {
        const isBoss = target.id === chapter.boss.id;
        const training = target.training || {};
        trainingObject.classList.toggle('is-boss', isBoss);
        trainingRole.textContent = isBoss ? 'Chapter Boss / 综合验收' : `Training star / ${target.type || 'knowledge'}`;
        trainingTitle.textContent = target.title || training.title || '无穷级数训练';
        trainingGoal.textContent = isBoss
          ? chapter.boss.integratedLearningGoal
          : training.goal || target.description || '完成当前训练能力。';
        trainingKind.textContent = training.kind || (isBoss ? 'boss_acceptance' : 'core_question');
        trainingQuestionTitle.textContent = training.title || (isBoss ? '全章黑洞验收' : '核心训练');
        renderTrainingStem(training.stem || '当前节点暂时缺少题干。');
        trainingContext.hidden = !isBoss;
        trainingContext.textContent = isBoss
          ? `覆盖范围：${chapter.boss.coversSystemIds.length} 个核心星系\n失败回流：\n${formatFailureRouting()}`
          : '';
        trainingAnswer.value = '';
        trainingReason.value = '';
        trainingFeedback.textContent = training.entryTrigger ? `题眼：${training.entryTrigger}` : '';
      };

      const renderTrainingStem = (value) => {
        const safeMarkup = String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        trainingStem.innerHTML = safeMarkup;
      };

      const closeTrainingObservatory = () => {
        window.clearTimeout(interaction.transitTimer);
        trainingTransit.classList.add('is-hidden');
        trainingTransit.setAttribute('aria-hidden', 'true');
        trainingObservatory.classList.add('is-hidden');
        trainingObservatory.setAttribute('aria-hidden', 'true');
        trainingObservatory.setAttribute('inert', '');
        document.body.classList.remove('is-transiting');
        document.body.classList.remove('is-learning');
        const restoreFocus = lastFocusedElement;
        lastFocusedElement = null;
        requestAnimationFrame(() => restoreFocus?.focus?.({ preventScroll: true }));
      };

      renderSectorNavigation();
      updateChapterMetrics();

      bossFrame.addEventListener('load', () => {
        const doc = bossFrame.contentDocument;
        if (!doc) return;
        ['.lab-hud', '#settings_panel', '#orbit_panel', '#cv_error_panel'].forEach((selector) => {
          const element = doc.querySelector(selector);
          if (element) element.style.display = 'none';
        });
        bossFrame.contentWindow?.bossObservatory?.setRenderScale?.(1.35);
      });

      const renderEmbeddedLayers = (milliseconds) => {
        updateObservatory(milliseconds);
        cosmosFrame.contentWindow?.renderCosmos?.(milliseconds);
        const bossView = bossFrame.contentWindow?.bossCameraView;
        if (bossView?.onRender) {
          bossFrame.contentWindow?.bossObservatory?.setState?.({
            azimuth: sceneFrame.boss.viewAzimuth,
            inclination: sceneFrame.boss.viewInclination,
            radiusIndex: sceneFrame.boss.observerRadiusIndex,
          });
          bossView.onRender();
          const source = bossFrame.contentDocument?.querySelector('#camera_view');
          const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
          const width = Math.max(2, Math.round(innerWidth * dpr));
          const height = Math.max(2, Math.round(innerHeight * dpr));
          if (bossComposite.width !== width || bossComposite.height !== height) {
            bossComposite.width = width;
            bossComposite.height = height;
          }
          if (source) {
            bossContext.clearRect(0, 0, width, height);
            const destinationWidth = Math.round(
              bossFrame.clientWidth * dpr * sceneFrame.boss.scale
            );
            const destinationHeight = Math.round(
              bossFrame.clientHeight * dpr * sceneFrame.boss.scale
            );
            const targetX = (innerWidth * 0.5 + sceneFrame.boss.center[0] * innerHeight * 0.5) * dpr;
            const targetY = (innerHeight * 0.5 - sceneFrame.boss.center[1] * innerHeight * 0.5) * dpr;
            const destinationX = Math.round(targetX - destinationWidth * 0.611);
            const destinationY = Math.round(targetY - destinationHeight * 0.545);
            bossContext.drawImage(
              source,
              0,
              0,
              source.width,
              source.height,
              destinationX,
              destinationY,
              destinationWidth,
              destinationHeight
            );
          }
        }
        requestAnimationFrame(renderEmbeddedLayers);
      };
      requestAnimationFrame(renderEmbeddedLayers);

      const source = (selector) => document.querySelector(selector).textContent.trimStart();
      const compile = (type, shaderSource) => {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, shaderSource);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          showRenderFailure('章节星系着色器编译失败，当前画面无法安全呈现。');
          throw new Error(gl.getShaderInfoLog(shader));
        }
        return shader;
      };
      const createProgram = (fragmentSource) => {
        const value = gl.createProgram();
        gl.attachShader(value, compile(gl.VERTEX_SHADER, source('#fullscreen-vertex')));
        gl.attachShader(value, compile(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(value);
        if (!gl.getProgramParameter(value, gl.LINK_STATUS)) {
          showRenderFailure('章节星系着色器连接失败，当前画面无法安全呈现。');
          throw new Error(gl.getProgramInfoLog(value));
        }
        return value;
      };

      const systemProgram = createProgram(source('#system-fragment'));
      const blurProgram = createProgram(source('#blur-fragment'));
      const compositeProgram = createProgram(source('#composite-fragment'));
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);

      const texture = (width, height) => {
        const value = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, value);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, width, height, 0, gl.RGBA, gl.HALF_FLOAT, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return value;
      };
      const target = (width, height) => {
        const color = texture(width, height);
        const framebuffer = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, color, 0);
        return { width, height, color, framebuffer };
      };
      const destroyTarget = (value) => {
        if (!value) return;
        gl.deleteTexture(value.color);
        gl.deleteFramebuffer(value.framebuffer);
      };

      let sceneTarget;
      let bloomA;
      let bloomB;
      const resize = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const width = Math.max(2, Math.round(innerWidth * dpr));
        const height = Math.max(2, Math.round(innerHeight * dpr));
        if (canvas.width === width && canvas.height === height) return;
        canvas.width = width;
        canvas.height = height;
        destroyTarget(sceneTarget);
        destroyTarget(bloomA);
        destroyTarget(bloomB);
        sceneTarget = target(width, height);
        bloomA = target(Math.max(2, width >> 2), Math.max(2, height >> 2));
        bloomB = target(Math.max(2, width >> 2), Math.max(2, height >> 2));
      };

      const uniform = (program, name) => gl.getUniformLocation(program, name);
      const systemUniforms = {
        resolution: uniform(systemProgram, 'resolution'),
        time: uniform(systemProgram, 'time'),
        planetData: uniform(systemProgram, 'planetData[0]'),
        planetMeta: uniform(systemProgram, 'planetMeta[0]'),
        routeA: uniform(systemProgram, 'routeA[0]'),
        routeB: uniform(systemProgram, 'routeB[0]'),
        routeC: uniform(systemProgram, 'routeC[0]'),
        routeD: uniform(systemProgram, 'routeD[0]'),
        routeMeta: uniform(systemProgram, 'routeMeta[0]'),
        systemData: uniform(systemProgram, 'systemData[0]'),
        bossData: uniform(systemProgram, 'bossData'),
      };
      const blurUniforms = {
        source: uniform(blurProgram, 'source'),
        texel: uniform(blurProgram, 'texel'),
        direction: uniform(blurProgram, 'direction'),
        threshold: uniform(blurProgram, 'threshold'),
      };
      const compositeUniforms = {
        sceneTexture: uniform(compositeProgram, 'sceneTexture'),
        bloomTexture: uniform(compositeProgram, 'bloomTexture'),
      };

      const targetsControls = (event) => event.target instanceof Element &&
        Boolean(event.target.closest('button, a, input, select, textarea'));
      const interactionLocked = () => document.body.classList.contains('is-learning') ||
        document.body.classList.contains('is-transiting');
      document.body.addEventListener('pointerdown', (event) => {
        if (event.button !== 0 || targetsControls(event) || interactionLocked()) return;
        interaction.dragging = true;
        interaction.moved = false;
        interaction.lastPointer = [event.clientX, event.clientY];
        interaction.startPointer = [event.clientX, event.clientY];
        document.body.classList.add('is-dragging');
        document.body.setPointerCapture?.(event.pointerId);
      });
      document.body.addEventListener('pointermove', (event) => {
        if (!interaction.dragging) return;
        const deltaX = event.clientX - interaction.lastPointer[0];
        const deltaY = event.clientY - interaction.lastPointer[1];
        interaction.lastPointer = [event.clientX, event.clientY];
        if (Math.hypot(
          event.clientX - interaction.startPointer[0],
          event.clientY - interaction.startPointer[1],
        ) > 6) interaction.moved = true;
        observatory.orbit(deltaX, deltaY, innerHeight);
      });
      const endDrag = (event) => {
        if (!interaction.dragging) return;
        const wasClick = !interaction.moved && event && !targetsControls(event);
        const point = event ? { x: event.clientX, y: event.clientY } : null;
        interaction.dragging = false;
        document.body.classList.remove('is-dragging');
        if (event?.pointerId !== undefined && document.body.hasPointerCapture?.(event.pointerId)) {
          document.body.releasePointerCapture(event.pointerId);
        }
        if (wasClick && point) {
          window.clearTimeout(interaction.clickTimer);
          interaction.clickTimer = window.setTimeout(() => {
            const target = pickSceneTarget(sceneFrame, point, { width: innerWidth, height: innerHeight });
            if (target) openTrainingTransit(target, point);
          }, 170);
        }
      };
      document.body.addEventListener('pointerup', endDrag);
      document.body.addEventListener('pointercancel', endDrag);
      window.addEventListener('blur', () => endDrag());
      window.addEventListener('wheel', (event) => {
        if (targetsControls(event) || interactionLocked()) return;
        event.preventDefault();
        observatory.dolly(event.deltaY);
      }, { passive: false });
      document.body.addEventListener('dblclick', (event) => {
        if (targetsControls(event) || interactionLocked()) return;
        window.clearTimeout(interaction.clickTimer);
        observatory.reset();
      });
      closeTraining.addEventListener('click', closeTrainingObservatory);
      trainingForm.addEventListener('submit', (event) => {
        event.preventDefault();
        trainingFeedback.textContent = trainingAnswer.value.trim()
          ? '作答已保留在当前训练舱；本阶段只接入章节内容与训练转场，不写入评分状态。'
          : '请先写出你的判断、过程和结论。';
      });
      window.addEventListener('keydown', (event) => {
        if (!document.body.classList.contains('is-learning')) return;
        if (event.code === 'Escape') {
          closeTrainingObservatory();
          return;
        }
        if (event.code !== 'Tab') return;
        const controls = [...trainingObservatory.querySelectorAll('button, textarea')]
          .filter((element) => !element.disabled && !element.hidden);
        if (!controls.length) return;
        const first = controls[0];
        const last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      const bindTexture = (value, unit) => {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, value);
      };
      const draw = (destination) => {
        gl.bindFramebuffer(gl.FRAMEBUFFER, destination?.framebuffer || null);
        gl.viewport(0, 0, destination?.width || canvas.width, destination?.height || canvas.height);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      };
      const blur = (sourceTarget, destination, direction, threshold) => {
        gl.useProgram(blurProgram);
        bindTexture(sourceTarget.color, 0);
        gl.uniform1i(blurUniforms.source, 0);
        gl.uniform2f(blurUniforms.texel, 1 / sourceTarget.width, 1 / sourceTarget.height);
        gl.uniform2f(blurUniforms.direction, direction[0], direction[1]);
        gl.uniform1f(blurUniforms.threshold, threshold);
        draw(destination);
      };

      const packedFrame = {
        planetData: new Float32Array(15 * 4),
        planetMeta: new Float32Array(15 * 4),
        routeA: new Float32Array(15 * 4),
        routeB: new Float32Array(15 * 4),
        routeC: new Float32Array(15 * 4),
        routeD: new Float32Array(15 * 4),
        routeMeta: new Float32Array(15 * 4),
        systemData: new Float32Array(3 * 4),
      };
      const packPoint = (target, index, point) => {
        target[index * 4] = point[0];
        target[index * 4 + 1] = point[1];
      };
      const uploadSceneFrame = () => {
        Object.values(packedFrame).forEach((values) => values.fill(0));
        sceneFrame.planets.forEach((planet, index) => {
          packPoint(packedFrame.planetData, index, planet.center);
          packedFrame.planetData[index * 4 + 2] = planet.radius;
          packedFrame.planetData[index * 4 + 3] = planet.energy;
          packedFrame.planetMeta[index * 4] = planet.seed;
          packedFrame.planetMeta[index * 4 + 1] = planet.heat;
          packedFrame.planetMeta[index * 4 + 2] = planet.depth;
        });
        sceneFrame.routes.forEach((route, index) => {
          packPoint(packedFrame.routeA, index, route.a);
          packPoint(packedFrame.routeB, index, route.b);
          packPoint(packedFrame.routeC, index, route.c);
          packPoint(packedFrame.routeD, index, route.d);
          packedFrame.routeMeta[index * 4] = route.seed;
          packedFrame.routeMeta[index * 4 + 1] = route.terminal;
          packedFrame.routeMeta[index * 4 + 2] = route.energy;
        });
        sceneFrame.systems.forEach((system, index) => {
          packPoint(packedFrame.systemData, index, system.center);
          packedFrame.systemData[index * 4 + 2] = system.radius;
          packedFrame.systemData[index * 4 + 3] = system.energy;
        });
        gl.uniform4fv(systemUniforms.planetData, packedFrame.planetData);
        gl.uniform4fv(systemUniforms.planetMeta, packedFrame.planetMeta);
        gl.uniform4fv(systemUniforms.routeA, packedFrame.routeA);
        gl.uniform4fv(systemUniforms.routeB, packedFrame.routeB);
        gl.uniform4fv(systemUniforms.routeC, packedFrame.routeC);
        gl.uniform4fv(systemUniforms.routeD, packedFrame.routeD);
        gl.uniform4fv(systemUniforms.routeMeta, packedFrame.routeMeta);
        gl.uniform4fv(systemUniforms.systemData, packedFrame.systemData);
        gl.uniform4f(
          systemUniforms.bossData,
          sceneFrame.boss.center[0],
          sceneFrame.boss.center[1],
          sceneFrame.boss.scale,
          sceneFrame.boss.lensStrength,
        );
      };

      const renderSystem = (milliseconds) => {
        resize();
        const seconds = milliseconds * 0.001;

        gl.disable(gl.BLEND);
        gl.useProgram(systemProgram);
        gl.uniform2f(systemUniforms.resolution, canvas.width, canvas.height);
        gl.uniform1f(systemUniforms.time, seconds);
        uploadSceneFrame();
        draw(sceneTarget);

        blur(sceneTarget, bloomA, [1, 0], 0.75);
        blur(bloomA, bloomB, [0, 1], 0.0);
        blur(bloomB, bloomA, [2.4, 0], 0.0);
        blur(bloomA, bloomB, [0, 2.4], 0.0);

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(compositeProgram);
        bindTexture(sceneTarget.color, 0);
        bindTexture(bloomB.color, 1);
        gl.uniform1i(compositeUniforms.sceneTexture, 0);
        gl.uniform1i(compositeUniforms.bloomTexture, 1);
        draw(null);
        gl.disable(gl.BLEND);

        requestAnimationFrame(renderSystem);
      };

      requestAnimationFrame(renderSystem);
      window.renderSystem = renderSystem;
    })();
  </script>
</body>
</html>
